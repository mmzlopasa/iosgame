[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="build/ios/Founders.ipa"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architectures/arm64=true
; CI builds an Xcode project and compiles it unsigned (sideload with Feather/Sideloadly, like the Unity IPA).
; The exporter wants a team id even then; this placeholder is never used for signing.
application/app_store_team_id="ABCDE12345"
application/export_project_only=true
application/export_method_debug=1
application/export_method_release=1
application/bundle_identifier="com.scyde.founders.godot"
application/signature=""
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=2
application/additional_plist_content=""
capabilities/performance_gaming_tier=true
user_data/accessible_from_files_app=true
user_data/accessible_from_itunes_sharing=true
icons/icon_1024x1024="res://icon.png"
storyboard/image_scale_mode=0
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.1255, 0.1529, 0.2039, 1)
