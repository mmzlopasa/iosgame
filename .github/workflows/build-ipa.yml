name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path Core

  ipa:
    name: Unsigned IPA
    needs: core-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (no signing)
        run: |
          xcodebuild -quiet \
            -project Founders.xcodeproj \
            -scheme Founders \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package Founders.ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Founders.app"
          test -d "$APP"
          rm -rf Payload Founders.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Founders.ipa Payload
          ls -lh Founders.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Founders-ipa
          path: Founders.ipa
          if-no-files-found: error

      # Rolling download link for Feather / Sideloadly (updated on every push to main).
      - name: Update "latest-build" pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (unsigned)
          prerelease: true
          body: "Unsigned IPA built from ${{ github.sha }}. Sign and install with Sideloadly or Feather."
          files: Founders.ipa

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Founders.ipa
