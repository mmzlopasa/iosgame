name: Generate AI models (Tripo)

# Text → 3D with Tripo, then the usual preparation (Blender decimation, PBR textures,
# art manifest). Run it by hand from the Actions tab; it commits the new models to the
# branch it runs on. Needs the repository secret TRIPO_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Model ids to generate, comma separated (empty = all missing ones from tools/assets/tripo_models.json)"
        required: false
        default: ""
      force:
        description: "Regenerate models that already exist"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow, numpy and Blender 4.2
        run: |
          pip install pillow numpy
          curl -sSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          sudo ln -sf "$PWD/blender-4.2.3-linux-x64/blender" /usr/local/bin/blender
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 >/dev/null
          blender --version | head -1

      - name: Generate
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: |
          test -n "$TRIPO_API_KEY" || { echo "::error::Add the TRIPO_API_KEY repository secret first."; exit 1; }
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 tools/assets/tripo_generate.py $ARGS

      - name: Commit models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/Assets/Art
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Art: AI-generated building models (Tripo)"
          git push
