name: Godot build (iOS)

# The Godot version of the game (godot/). The Unity version is frozen on the branch unity-archive.
on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  checks:
    name: Rules tests + C# compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet build (Godot project)
        run: dotnet build godot/Founders.csproj -nologo -clp:NoSummary 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: dotnet test (game rules)
        run: dotnet test godot/tests -nologo --logger "console;verbosity=minimal" 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # Cloud sessions cannot read job logs, so on a failure the compiler output goes to the "godot-ci-logs" pre-release.
      - name: Publish the logs (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-ci-logs
          name: Godot CI logs (last failure)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Logs of the last failed Godot build (${{ github.ref_name }} @ ${{ github.sha }})."
          files: |
            build.log
            test.log

  ios-ipa:
    name: iOS IPA (unsigned)
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Godot 4.7's iOS templates link against the iOS 26 SDK: use the newest Xcode on the runner.
      - name: Newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$X" ] || X="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Godot ${{ env.GODOT_VERSION }} (.NET) + export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -path '*Contents/MacOS/Godot' -type f | head -1)"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$DEST"
          mv "$RUNNER_TEMP/tpl/templates/"* "$DEST/"
          ls "$DEST"
          rm -f godot.zip templates.tpz
          "$GODOT" --version

      # The Asset Store "Adventure UI Kit" is licensed and may not sit in this public repository: it lives in the
      # private repository mmzlopasa/iosgame-uikit and is fetched with the KIT_TOKEN secret; its chosen pictures
      # are prepared into godot/art/ui/Kit (not in git). Without the secret the game's own interface look is used.
      - name: Adventure UI Kit (private repository, optional)
        env:
          KIT_TOKEN: ${{ secrets.KIT_TOKEN }}
        run: |
          if [ -z "$KIT_TOKEN" ]; then echo "No KIT_TOKEN secret: the game's own interface look is used."; exit 0; fi
          if ! git clone --depth 1 "https://x-access-token:${KIT_TOKEN}@github.com/mmzlopasa/iosgame-uikit.git" "$RUNNER_TEMP/kit"; then
            echo "::warning::Could not fetch mmzlopasa/iosgame-uikit: the game's own interface look is used."; exit 0
          fi
          MAP=unity/Assets/Custom/AdventureUiKit.txt
          if [ -f "$RUNNER_TEMP/kit/AdventureUiKit.txt" ]; then MAP="$RUNNER_TEMP/kit/AdventureUiKit.txt"; fi
          python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
          python3 tools/godot/kit_skins.py "$RUNNER_TEMP/kit/Kit" "$MAP" godot/art/ui/Kit || echo "::warning::Kit preparation failed: the game's own look is used."
          rm -rf "$RUNNER_TEMP/kit"

      - name: Import the project
        working-directory: godot
        run: |
          "$GODOT" --headless --import || true
          "$GODOT" --headless --build-solutions --quit || true

      # A short headless run that opens every window once (Main.Smoke): errors show in smoke.log. Log only, no pictures.
      - name: Smoke run (headless)
        working-directory: godot
        run: |
          perl -e 'alarm 240; exec @ARGV' "$GODOT" --headless --path . -- --smoke > "$GITHUB_WORKSPACE/smoke.log" 2>&1 || echo "::warning::smoke run ended with $?"
          grep -n -E "SMOKE|ERROR|Exception|error" "$GITHUB_WORKSPACE/smoke.log" | head -120 || true

      - name: Export the Xcode project
        working-directory: godot
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --export-release "iOS" build/ios/Founders.ipa 2>&1 | tee export.log
          ls -la build/ios
          test -d build/ios/Founders.xcodeproj || { echo "::error::Godot did not write an Xcode project (see export.log)"; exit 1; }

      - name: Build the app (unsigned)
        working-directory: godot/build/ios
        run: |
          xcodebuild -list -project Founders.xcodeproj
          xcodebuild -project Founders.xcodeproj -scheme Founders -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || {
              grep -n -E "error|Error" "$GITHUB_WORKSPACE/xcodebuild.log" | head -80; exit 1; }
          tail -20 "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package Founders-Godot.ipa
        run: |
          set -e
          APP="$(find godot/build/ios/dd/Build/Products -name '*.app' -maxdepth 2 | head -1)"
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Founders-Godot.ipa Payload
          ls -lh Founders-Godot.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Founders-Godot-ipa
          path: Founders-Godot.ipa
          if-no-files-found: error

      # Cloud sessions cannot read job logs, so on a failure the logs go to the "godot-ci-logs" pre-release.
      - name: Publish the logs (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-ci-logs
          name: Godot CI logs (last failure)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Logs of the last failed Godot build (${{ github.ref_name }} @ ${{ github.sha }})."
          files: |
            godot/export.log
            xcodebuild.log
            smoke.log

      # Cloud sessions cannot reach artifact storage, but release assets download fine.
      - name: Publish to the "godot-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: Godot build (unsigned IPA)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Godot build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - **Founders-Godot.ipa**: sign and install with Feather or Sideloadly. It installs next to the Unity app (its own bundle id).
          files: |
            Founders-Godot.ipa
            smoke.log
            godot/export.log
